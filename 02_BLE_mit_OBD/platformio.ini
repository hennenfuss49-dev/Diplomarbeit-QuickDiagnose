; Plattform-Konfiguration: ESP32-S3-DevKitC-1-N8R8
; Framework und BLE-Implementierung analog zum erfolgreichen Test 1.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Keine zusaetzliche Library-Installation erforderlich:
; BLEDevice, BLEServer, BLE2902 sind im ESP32-Arduino-Framework enthalten.
; Bei Bedarf kann die Flash/PSRAM-Variante spaeter explizit konfiguriert werden.
